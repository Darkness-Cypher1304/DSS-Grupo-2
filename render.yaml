# ============================================================================
# NeuroAlert · render.yaml — Infrastructure as Code para Render
# ============================================================================
# Define TODOS los servicios del proyecto:
#   - backend-prod  (branch: main)
#   - backend-dev   (branch: develop)
#   - frontend-prod (branch: main)
#   - frontend-dev  (branch: develop)
#   - PostgreSQL prod + dev
#   - Redis prod + dev
#
# Para aplicar: conecta este repo en https://dashboard.render.com
# y Render leerá este archivo automáticamente.
# ============================================================================

services:

  # ==========================================================================
  # BACKEND · PRODUCCIÓN
  # ==========================================================================
  - type: web
    name: neuroalert-backend-prod
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        fromDatabase:
          name: neuroalert-db-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neuroalert-redis-prod
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: neuroalert-redis-prod
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: neuroalert-redis-prod
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: JWT_ISSUER
        value: neuroalert
      - key: JWT_AUDIENCE
        value: neuroalert-users
      - key: FRONTEND_URL
        value: https://neuroalert-frontend-prod.onrender.com
      - key: CORS_ORIGINS
        value: https://neuroalert-frontend-prod.onrender.com
      - key: COOKIE_DOMAIN
        value: .onrender.com
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: BCRYPT_ROUNDS
        value: 12
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 100
      - key: THROTTLE_AUTH_LIMIT
        value: 10
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: LOGIN_LOCKOUT_DURATION
        value: 900
      - key: PASSWORD_MIN_LENGTH
        value: 12
      - key: SESSION_IDLE_TIMEOUT
        value: 1800
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_FROM_NAME
        value: NeuroAlert
      # MinIO deshabilitado en Render (plan free no soporta volúmenes persistentes)
      - key: MINIO_ENDPOINT
        value: ""
      - key: MINIO_PORT
        value: "9000"
      - key: MINIO_USE_SSL
        value: "false"
      - key: MINIO_BUCKET_NAME
        value: neuroalert-resources
      - key: MINIO_ROOT_USER
        value: minioadmin
      - key: MINIO_ROOT_PASSWORD
        generateValue: true

  # ==========================================================================
  # BACKEND · DESARROLLO
  # ==========================================================================
  - type: web
    name: neuroalert-backend-dev
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: develop
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: debug
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        fromDatabase:
          name: neuroalert-db-dev
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neuroalert-redis-dev
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: neuroalert-redis-dev
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: neuroalert-redis-dev
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: JWT_ISSUER
        value: neuroalert
      - key: JWT_AUDIENCE
        value: neuroalert-users
      - key: FRONTEND_URL
        value: https://neuroalert-frontend-dev.onrender.com
      - key: CORS_ORIGINS
        value: https://neuroalert-frontend-dev.onrender.com
      - key: COOKIE_DOMAIN
        value: .onrender.com
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: BCRYPT_ROUNDS
        value: 12
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 200
      - key: THROTTLE_AUTH_LIMIT
        value: 20
      - key: MAX_LOGIN_ATTEMPTS
        value: 10
      - key: LOGIN_LOCKOUT_DURATION
        value: 300
      - key: PASSWORD_MIN_LENGTH
        value: 12
      - key: SESSION_IDLE_TIMEOUT
        value: 3600
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_FROM_NAME
        value: NeuroAlert DEV
      - key: MINIO_ENDPOINT
        value: ""
      - key: MINIO_PORT
        value: "9000"
      - key: MINIO_USE_SSL
        value: "false"
      - key: MINIO_BUCKET_NAME
        value: neuroalert-resources-dev
      - key: MINIO_ROOT_USER
        value: minioadmin
      - key: MINIO_ROOT_PASSWORD
        generateValue: true

  # ==========================================================================
  # FRONTEND · PRODUCCIÓN
  # ==========================================================================
  - type: web
    name: neuroalert-frontend-prod
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    branch: main
    region: oregon
    plan: free
    buildArgs:
      - key: NEXT_PUBLIC_API_URL
        value: https://neuroalert-backend-prod.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: NeuroAlert
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: https://neuroalert-frontend-prod.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        value: https://neuroalert-backend-prod.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: NeuroAlert
      - key: NEXT_PUBLIC_APP_DESCRIPTION
        value: "Detección temprana del TEA"

  # ==========================================================================
  # FRONTEND · DESARROLLO
  # ==========================================================================
  - type: web
    name: neuroalert-frontend-dev
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    branch: develop
    region: oregon
    plan: free
    buildArgs:
      - key: NEXT_PUBLIC_API_URL
        value: https://neuroalert-backend-dev.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: NeuroAlert DEV
    envVars:
      - key: NODE_ENV
        value: development
      - key: NEXTAUTH_URL
        value: https://neuroalert-frontend-dev.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        value: https://neuroalert-backend-dev.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: NeuroAlert DEV
      - key: NEXT_PUBLIC_APP_DESCRIPTION
        value: "Detección temprana del TEA [DEV]"

# ============================================================================
# BASES DE DATOS
# ============================================================================
databases:
  - name: neuroalert-db-prod
    plan: free
    region: oregon
    databaseName: neuroalert
    user: neuroalert

  - name: neuroalert-db-dev
    plan: free
    region: oregon
    databaseName: neuroalert_dev
    user: neuroalert_dev

# ============================================================================
# REDIS
# ============================================================================
  - name: neuroalert-redis-prod
    type: redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

  - name: neuroalert-redis-dev
    type: redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
