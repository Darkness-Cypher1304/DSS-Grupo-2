# ============================================================================
# NeuroAlert · Docker Compose · DESARROLLO
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: neuroalert_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - neuroalert_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # Redis 7
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: neuroalert_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neuroalert_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # MinIO
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: neuroalert_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - neuroalert_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # MinIO Init
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: neuroalert_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - neuroalert_net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME};
      mc anonymous set download local/${MINIO_BUCKET_NAME};
      echo 'MinIO bucket created successfully';
      exit 0;
      "

  # --------------------------------------------------------------------------
  # Backend — NestJS 11
  # Sin healthcheck: Alpine no trae wget/curl y en dev no es necesario.
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: neuroalert_backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "4000:4000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - neuroalert_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # Frontend — Next.js 15
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: neuroalert_frontend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - neuroalert_net
    depends_on:
      - backend
    command: npm run dev
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # Nginx
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: neuroalert_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    networks:
      - neuroalert_net
    depends_on:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true

# ============================================================================
# Volúmenes persistentes
# ============================================================================
volumes:
  postgres_data:
    name: neuroalert_postgres_data
  redis_data:
    name: neuroalert_redis_data
  minio_data:
    name: neuroalert_minio_data

# ============================================================================
# Red privada
# ============================================================================
networks:
  neuroalert_net:
    name: neuroalert_net
    driver: bridge
  