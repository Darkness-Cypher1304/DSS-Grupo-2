# ============================================================================
# NeuroAlert · Nginx · Configuración Hardened
# ============================================================================
# Primera línea de defensa de la aplicación. Implementa:
#   - Rate limiting por IP (defensa DDoS)
#   - Headers de seguridad OWASP completos
#   - Bloqueo de métodos HTTP no permitidos
#   - Compresión Gzip
#   - Reverse proxy a frontend (Next.js) y backend (NestJS)
# ============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ------------------------------------------------------------------------
    # MIME types y básicos
    # ------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ------------------------------------------------------------------------
    # NO REVELAR LA TECNOLOGÍA DEL STACK
    # ------------------------------------------------------------------------
    # server_tokens off oculta la versión de nginx. Para ocultar X-Powered-By
    # el backend lo hace con helmet.hidePoweredBy(). Defensa en capas.
    server_tokens off;

    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------
    log_format main_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_time":$request_time'
        '}';
    access_log /var/log/nginx/access.log main_json;

    # ------------------------------------------------------------------------
    # Performance
    # ------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    client_body_buffer_size 16K;
    client_header_buffer_size 1K;
    large_client_header_buffers 4 8K;

    # Timeouts conservadores (prevención Slowloris)
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ------------------------------------------------------------------------
    # Compresión Gzip
    # ------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # RATE LIMITING — DEFENSA DDoS
    # ------------------------------------------------------------------------
    # Zona global: 100 req/min por IP
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/m;

    # Zona auth: 10 req/min por IP (login, register, password reset)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # Zona uploads: 20 req/min por IP
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;

    # Conexiones concurrentes por IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Respuesta cuando se excede el rate limit
    limit_req_status 429;
    limit_conn_status 429;

    # ------------------------------------------------------------------------
    # SERVIDOR PRINCIPAL
    # ------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Aplicar headers de seguridad
        include /etc/nginx/security-headers.conf;

        # Rate limit y conexiones por defecto
        limit_req zone=global_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        # ------------------------------------------------------------------
        # BLOQUEAR MÉTODOS HTTP NO PERMITIDOS
        # ------------------------------------------------------------------
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # ------------------------------------------------------------------
        # Bloquear archivos sensibles (defensa contra path traversal)
        # ------------------------------------------------------------------
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }

        location ~* \.(env|git|sql|bak|log|config|ini|key|pem|crt)$ {
            deny all;
            return 404;
        }

        # ------------------------------------------------------------------
        # API → Backend (NestJS)
        # ------------------------------------------------------------------
        location /api/ {
            # Rate limit más estricto en endpoints de auth
            location ~ ^/api/auth/ {
                limit_req zone=auth_limit burst=5 nodelay;
                proxy_pass http://backend:4000;
                include /etc/nginx/security-headers.conf;
            }

            # Endpoints de upload con rate limit propio
            location ~ ^/api/.*/upload {
                limit_req zone=upload_limit burst=10 nodelay;
                client_max_body_size 25M;
                proxy_pass http://backend:4000;
                include /etc/nginx/security-headers.conf;
            }

            proxy_pass http://backend:4000;

            # Headers de proxy
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # ------------------------------------------------------------------
        # Todo lo demás → Frontend (Next.js)
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://frontend:3000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Página de error personalizada (no revelar info técnica)
        # ------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"error":"Service temporarily unavailable","statusCode":503}';
            add_header Content-Type application/json;
        }

        error_page 429 /429.html;
        location = /429.html {
            return 429 '{"error":"Too many requests","statusCode":429,"retryAfter":60}';
            add_header Content-Type application/json;
            add_header Retry-After 60;
        }
    }
}
