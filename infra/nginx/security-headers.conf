# ============================================================================
# NeuroAlert · Headers de Seguridad OWASP
# ============================================================================
# Implementación de TODOS los headers recomendados por OWASP Secure Headers
# Project. Cada uno previene una clase específica de ataques.
# ============================================================================

# ----------------------------------------------------------------------------
# HSTS — Forzar HTTPS por 2 años, incluyendo subdominios
# Previene: ataques de downgrade SSL, cookie hijacking en redes públicas
# ----------------------------------------------------------------------------
# NOTA: en desarrollo (HTTP) este header no aplica, en producción es crítico.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ----------------------------------------------------------------------------
# X-Content-Type-Options — Prevenir MIME type sniffing
# Previene: que el navegador "adivine" el tipo de un archivo y lo ejecute
# ----------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;

# ----------------------------------------------------------------------------
# X-Frame-Options — Prevenir clickjacking
# Previene: que la app sea embebida en <iframe> en sitios maliciosos
# ----------------------------------------------------------------------------
add_header X-Frame-Options "DENY" always;

# ----------------------------------------------------------------------------
# Referrer-Policy — Limitar info enviada en el header Referer
# Previene: leak de URLs internas a terceros
# ----------------------------------------------------------------------------
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ----------------------------------------------------------------------------
# Permissions-Policy — Bloquear APIs sensibles del navegador
# Previene: acceso no autorizado a cámara, micrófono, geolocalización, etc.
# ----------------------------------------------------------------------------
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

# ----------------------------------------------------------------------------
# Content-Security-Policy — La defensa #1 contra XSS
# Previene: ejecución de scripts inyectados, carga de recursos de orígenes no autorizados
# ----------------------------------------------------------------------------
# 'self' = solo recursos del mismo origen
# 'unsafe-inline' en style-src es necesario para Next.js (CSS-in-JS)
# 'unsafe-eval' es necesario en development por React fast-refresh, en prod se quita
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:4000 ws://localhost:3000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

# ----------------------------------------------------------------------------
# X-XSS-Protection — Legacy, pero algunos navegadores aún lo respetan
# ----------------------------------------------------------------------------
add_header X-XSS-Protection "1; mode=block" always;

# ----------------------------------------------------------------------------
# Cross-Origin-* — Aislamiento de origen
# Previene: ataques tipo Spectre/Meltdown via SharedArrayBuffer
# ----------------------------------------------------------------------------
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
