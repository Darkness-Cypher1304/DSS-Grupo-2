name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Tests + Análisis de Seguridad
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Análisis de seguridad (Bandit)
        run: |
          pip install bandit
          bandit -r . -ll -ii --exclude ./tests,./venv

  # CodeQL corre EN PARALELO al job test (sin needs): analisis estatico de
  # seguridad (SAST) sobre el codigo Python y los workflows. Reporta al tab
  # Security del repo y NO bloquea el deploy (deploy-dev solo needs: test).
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  deploy-dev:
    name: Deploy a Desarrollo
    needs: [test, codeql]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a Dev (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_DEV_HOOK }}
          echo "Deploy a Dev disparado"
      - name: Esperar que Render inicie
        run: sleep 30

  smoke-test:
    name: Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que Dev responde
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://miapp-dev.onrender.com/health)
            if [[ $STATUS -eq 200 ]]; then
              echo "Dev responde correctamente (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i fallido (HTTP $STATUS), reintentando..."
            sleep 10
          done
          echo "Dev no responde después de 5 intentos"
          exit 1
  dast:
    name: DAST - OWASP ZAP
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://miapp-dev.onrender.com'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          fail_threshold: 'High'
          artifact_name: 'zap-baseline-report'

      - name: Subir reporte ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30

  deploy-prod:
    name: Deploy a Producción
    needs: dast
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Prod (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}
          echo "Deploy a Producción disparado"
