name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Tests + Análisis de Seguridad
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Análisis de seguridad (Bandit)
        run: |
          pip install bandit
          bandit -r . -ll -ii --exclude ./tests,./venv

  # CodeQL corre EN PARALELO al job test (sin needs): analisis estatico de
  # seguridad (SAST) sobre el codigo Python y los workflows. Reporta al tab
  # Security del repo y NO bloquea el deploy (deploy-dev solo needs: test).
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  deploy-dev:
    name: Deploy a Desarrollo
    needs: [test, codeql]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a Dev (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_DEV_HOOK }}
          echo "Deploy a Dev disparado"
      - name: Esperar que Render inicie
        run: sleep 30

  smoke-test:
    name: Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que Dev responde
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://miapp-dev.onrender.com/health)
            if [[ $STATUS -eq 200 ]]; then
              echo "Dev responde correctamente (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i fallido (HTTP $STATUS), reintentando..."
            sleep 10
          done
          echo "Dev no responde después de 5 intentos"
          exit 1
  dast:
    name: DAST - OWASP ZAP
    needs: smoke-test
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
  
      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://miapp-dev.onrender.com'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

  security-gate:
    name: Security Gate
    needs: dast
    runs-on: ubuntu-latest

    steps:
      - name: Descargar reporte ZAP
        uses: actions/download-artifact@v4
        with:
          name: zap-baseline-report

      - name: Evaluar política de seguridad
        run: |
          python << 'EOF'
          import json
          import sys

          with open("report_json.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          high_count = 0
          medium_count = 0

          blacklist = {
              "40018",  # SQL Injection
              "40012",  # Reflected XSS
              "40014",  # Stored XSS
              "10202"   # CSRF
          }

          found_blacklist = set()

          for site in data.get("site", []):
              for alert in site.get("alerts", []):

                  plugin_id = str(alert.get("pluginid", ""))

                  risk = str(alert.get("riskdesc", "")).lower()

                  if "high" in risk:
                      high_count += 1

                  elif "medium" in risk:
                      medium_count += 1

                  if plugin_id in blacklist:
                      found_blacklist.add(plugin_id)

          print("=== RESUMEN SECURITY GATE ===")
          print(f"High encontrados: {high_count}")
          print(f"Medium encontrados: {medium_count}")
          print(f"Blacklist encontrados: {len(found_blacklist)}")

          if found_blacklist:
              print("\nVulnerabilidades críticas detectadas:")
              for vuln in sorted(found_blacklist):
                  print(f" - {vuln}")
              sys.exit(1)

          if high_count >= 1:
              print("\nSe detectaron vulnerabilidades HIGH")
              sys.exit(1)

          if medium_count >= 5:
              print("\nSe detectaron 5 o más vulnerabilidades MEDIUM")
              sys.exit(1)

          print("\nSecurity Gate aprobado")
          EOF
  
  deploy-prod:
    name: Deploy a Producción
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Prod (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}
          echo "Deploy a Producción disparado"
