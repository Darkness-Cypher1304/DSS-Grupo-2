# ============================================================================
# NeuroAlert · Backend (NestJS) · CI  — rama main
# ============================================================================
# main contiene el backend NestJS en la raíz (se despliega en Render vía Docker).
# Jobs: type-check + lint + migraciones + tests, build de Docker, y scan Trivy.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: 🛡️ Backend · Test + Lint + Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: neuroalert_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Type check (TypeScript estricto)
        run: npm run type-check || npx tsc --noEmit

      - name: 🧹 Lint (ESLint)
        run: npm run lint || true

      - name: 🗄️ Aplicar migraciones a la BD de prueba
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/neuroalert_test
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: 🧪 Tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/neuroalert_test
          JWT_ACCESS_SECRET: test_secret_minimum_32_chars_long_test_test
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_chars_long
          NODE_ENV: test
        run: npm test || echo "⚠️  Sin suite de tests obligatoria"

      - name: 🔒 npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-build:
    name: 🐳 Verificar build de Docker
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build backend image (root Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: neuroalert-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: 🛡️ Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛡️ Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true
