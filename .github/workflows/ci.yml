name: CI/CD Pipeline

# ============================================================================
# ARQUITECTURA (versión final — NeuroAlert backend)
# ----------------------------------------------------------------------------
# Organizada por OBJETIVO (fail-fast + DevSecOps + pirámide de testing). Las
# etapas se leen de arriba hacia abajo en orden de ejecución; los prefijos de
# nombre agrupan visualmente cada responsabilidad (GitHub Actions no tiene
# "stages" nativos, así que la agrupación se expresa con nombres + `needs`).
#
#   ═══════════════ FASE CI (push Y pull_request) ═══════════════
#   Etapa 1 · CALIDAD & BUILD
#     └─ Calidad · Code Quality & Build   (type-check · lint · nest build)
#                     │
#        ┌────────────┴───────────────────────────┐
#        ▼                                         ▼
#   Etapa 2 · SAST (código propio)          Etapa 3 · SCA (dependencias)
#     ├─ SAST · CodeQL (JS/TS)  [security-extended]   ├─ SCA · Supply Chain (Trivy+SBOM)  [report-only]
#     └─ Seguridad CI · CodeQL (Actions)              └─ SCA · Dependency Audit Gate (npm)  [BLOQUEANTE]
#        └────────────┬───────────────────────────┘
#                     ▼  (tests esperan calidad + TODA la seguridad estática)
#   Etapa 4 · PRUEBAS
#     ├─ Unit Tests  ∥  Integration Tests   (contenido intacto)
#     └────────┬────────┘
#              ▼
#        Coverage Gate 85%                   (contenido intacto)
#
#   ═══════════════ FASE CD (solo push a main) ═══════════════
#              ▼
#        Deploy a Desarrollo                 (needs: coverage-gate)
#              ▼
#        Health Check + Smoke Test (Dev)     (verificación reforzada de /health)
#              ▼
#        ┌───────────────────────────┐
#        ▼                           ▼
#   DAST (OWASP ZAP)         E2E (fundacional)   ← en paralelo (ahorro de tiempo)
#        └───────────┬───────────────┘
#                    ▼
#   Security Gate · Reporte DAST (ZAP)   (needs: dast, e2e)
#                    ▼
#        Deploy a Producción
#                    ▼
#        Production Health Check          (paridad con el Health Check de Dev)
#
# NOTA (modelo de ejecución de GitHub Actions): cada job corre en una VM nueva
# y aislada; NO existe un job "setup" reutilizable (su entorno no persiste entre
# jobs). Por eso cada job repite el bloque checkout + setup-node(cache npm) +
# npm ci: es el patrón idiomático y garantiza entornos reproducibles (Node 20).
# ============================================================================

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================================================
  # ETAPA 1 · CALIDAD & BUILD — primera barrera técnica (fail-fast).
  # Fusiona el antiguo `quality` (type-check + lint) con el `build`, que antes
  # corría DESPUÉS de los tests. Se adelanta a esta etapa: no tiene sentido
  # testear/desplegar si el proyecto ni compila. El `nest build` es idéntico;
  # solo cambia de posición.
  #   · type-check (tsc --noEmit): seguridad de tipos de `src/` (fail-fast barato).
  #   · lint (eslint calidad): estilo/calidad + corrección (no-unused-vars, etc.).
  #   · build (nest build → tsc): compila y, de paso, revalida tipos del emit.
  # ==========================================================================
  code-quality-build:
    name: Calidad · Code Quality & Build (type-check + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client (tipos para tsc/eslint/build)
        run: npx prisma generate
      - name: Type Check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Compilar (nest build)
        run: npm run build

  # ==========================================================================
  # ETAPA 2 · SAST (seguridad del CÓDIGO propio) + Seguridad de CI.
  # CodeQL es el SAST semántico de referencia (dataflow/taint tracking) y sube
  # sus hallazgos a GitHub Security → Code scanning (los "reportes en GitHub").
  # La matriz cubre DOS objetivos distintos con la misma acción:
  #   · javascript-typescript → SAST del código de la app (src/). Suite ampliado
  #     a `security-extended` para más cobertura de queries de seguridad.
  #   · actions               → analiza los propios workflows (.github/workflows)
  #     en busca de vulnerabilidades de la PIPELINE (script injection, etc.).
  # Coexiste con ESLint-security (SAST sintáctico de feedback rápido): jobs
  # separados, complementarios; no compiten.
  # ==========================================================================
  codeql:
    name: ${{ matrix.display }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            display: 'SAST · CodeQL (JavaScript/TypeScript)'
            queries: security-extended
          - language: actions
            display: 'Seguridad CI · CodeQL (Actions)'
            queries: ''
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: ${{ matrix.queries }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # SAST de patrones inseguros (eslint-plugin-security). BLOQUEANTE (--max-warnings 0).
  # Config SEPARADA (eslint.security.config.js) de la de calidad: distinta
  # responsabilidad. Complementa a CodeQL con feedback rápido a velocidad de lint
  # (recomendación del curso: iniciar el SAST con eslint-security + CodeQL).
  eslint-security:
    name: SAST · ESLint Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: ESLint Security (bloqueante)
        run: npm run lint:security

  # ==========================================================================
  # ETAPA 3 · SCA (seguridad de DEPENDENCIAS / cadena de suministro).
  # Distinta de la Etapa 2: aquí NO se analiza el código propio sino el árbol de
  # dependencias (node_modules / lockfile).
  # ==========================================================================

  # Supply chain: Trivy (vulnerabilidades del árbol) + SBOM CycloneDX. Report-only.
  # ⏳ A FUTURO: evaluar volver Trivy bloqueante (hoy exit-code 0 por decisión
  # validada durante el desarrollo; convertirlo en gate es otra decisión).
  supply-chain:
    name: SCA · Supply Chain (Trivy + SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Trivy - escaneo de vulnerabilidades (SARIF, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Subir resultados de Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy - generar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: cyclonedx
          output: sbom.cdx.json

      - name: Subir SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-backend
          path: sbom.cdx.json
          retention-days: 90

  # npm audit como GATE BLOQUEANTE en prod (OWASP A06). Falla ante HIGH/CRITICAL
  # en dependencias de producción salvo excepción documentada y vigente en
  # .github/audit-allowlist.json (ver docs/SECURITY-DEPENDENCIES.md).
  dependency-scan:
    name: SCA · Dependency Audit Gate (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Gate de dependencias de producción (bloqueante + allowlist)
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/audit-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # ETAPA 4 · PRUEBAS.
  # UNIT ∥ INTEGRATION — jobs SEPARADOS y en PARALELO (pirámide de testing).
  # Esperan a Code Quality & Build Y a TODA la etapa de seguridad estática
  # (no se testea si la seguridad bloqueante falló). Ninguno necesita Postgres:
  # la integración mockea Prisma (análogo a MSW en el frontend). La DB real
  # queda para el e2e (fase CD).
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    needs: [code-quality-build, codeql, eslint-security, supply-chain, dependency-scan]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Ejecutar Unit Tests
        run: mkdir -p tests/reports && npx jest tests/unit --ci --json --outputFile=tests/reports/results-unit.json
      - name: Publicar resumen de Unit Tests
        if: always()
        run: node .github/scripts/test-summary.mjs tests/reports/results-unit.json "🧪 Unit Tests"

  integration-tests:
    name: Integration Tests
    needs: [code-quality-build, codeql, eslint-security, supply-chain, dependency-scan]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Ejecutar Integration Tests
        run: mkdir -p tests/reports && npx jest tests/integration --ci --forceExit --json --outputFile=tests/reports/results-integration.json
      - name: Publicar resumen de Integration Tests
        if: always()
        run: node .github/scripts/test-summary.mjs tests/reports/results-integration.json "🔗 Integration Tests"

  # ==========================================================================
  # COVERAGE GATE — corre la suite COMBINADA con cobertura y aplica el umbral
  # del 85% en las 4 métricas (coverageThreshold de Jest → falla el job). La
  # cobertura es propiedad del CÓDIGO, no de una suite: gatear sobre la
  # combinada evita forzar una pirámide invertida. Publica el reporte multivista.
  # ==========================================================================
  coverage-gate:
    name: Coverage Gate (85%)
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historia completa → patch coverage (código nuevo)
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Cobertura COMBINADA + gate 85% (falla si no se cumple)
        run: npm run test:coverage -- --ci
      - name: Cobertura por tipo (solo para el reporte, no gatea)
        if: always()
        run: |
          npx jest tests/unit --coverage --coverageDirectory=tests/reports/coverage-unit --coverageThreshold='{}' --ci || true
          npx jest tests/integration --coverage --coverageDirectory=tests/reports/coverage-integration --coverageThreshold='{}' --forceExit --ci || true
      - name: Reporte de cobertura (multivista)
        if: always()
        run: node .github/scripts/coverage-summary.mjs

  # ==========================================================================
  # FASE CD — solo en push a main (deploy-dev tiene `if: main`; el resto de la
  # cadena hereda esa condición por `needs`, así que en pull_request se salta).
  # ==========================================================================

  # DEPLOY DEV — depende SOLO del Coverage Gate (que ya arrastra calidad + build
  # + seguridad estática + tests). Inmediatamente después del gate. Contenido
  # INTACTO (hook de Render + espera).
  deploy-dev:
    name: Deploy a Desarrollo
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a Dev (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_DEV_HOOK }}
          echo "Deploy a Dev disparado"
      - name: Esperar que Render inicie
        run: sleep 30

  # ==========================================================================
  # HEALTH CHECK + SMOKE TEST (Dev) — valida que la instancia DEV desplegada
  # quedó operativa Y es la versión nueva. Reforzado (script compartido
  # health-check.sh): además de "responde y es el NestJS", verifica HTTP 200,
  # parsea el JSON con jq, exige checks.database == true (GATE DURO), reporta
  # checks.cache (Redis opcional, tolerante) y las cabeceras de seguridad
  # (Helmet). Read-only. Ver .github/scripts/health-check.sh.
  # ==========================================================================
  smoke-test:
    name: Health Check + Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Health Check + Smoke Test reforzado (Dev)
        run: bash .github/scripts/health-check.sh https://miapp-dev.onrender.com "Dev"

  # ==========================================================================
  # DAST — OWASP ZAP contra la instancia DEV desplegada. Corre en PARALELO con
  # el e2e (ambos dependen del smoke) para ahorrar tiempo de pared. Contenido
  # INTACTO.
  # ==========================================================================
  dast:
    name: DAST - OWASP ZAP
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://miapp-dev.onrender.com'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

  # ==========================================================================
  # E2E (fundacional) — app REAL contra un Postgres REAL EFÍMERO (service
  # container postgres:15). Self-contained: levanta su propia app + su propia BD
  # en el runner y la destruye al terminar → NO toca la BD de dev/prod, cero
  # riesgo de romper datos o la demo. Corre en paralelo con el DAST.
  #
  # ⚠️ NOTA HONESTA (en construcción): este job NO representa aún la
  # implementación IDEAL de un e2e post-deploy. Es una BASE fundacional (flujos
  # críticos health/auth/M-CHAT vía supertest) pensada para hacer CRECER el e2e;
  # su objetivo futuro es un e2e completo contra el entorno desplegado. Por ahora
  # valida migraciones, SQL real, transacciones, runWithUserContext y el
  # aislamiento por usuario a nivel de app (IDOR → 404), de forma AISLADA y segura.
  # ⚠️ RLS FORCE NO se valida aquí (la app conecta como superusuario → bypass);
  # su efecto se verifica en Render (dueño no-superusuario). Ver tests/e2e/README.md.
  # Contenido de los tests: INTACTO.
  # ==========================================================================
  e2e:
    name: E2E (fundacional · app real + Postgres efímero)
    needs: smoke-test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neuroalert_e2e?schema=public
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuroalert_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Aplicar migraciones (incl. RLS) a la BD de test
        run: npx prisma migrate deploy
      - name: Ejecutar E2E (app real + Postgres)
        run: npm run test:e2e

  # ==========================================================================
  # SECURITY GATE · Reporte DAST (ZAP) — evalúa el reporte del ZAP contra la
  # política de seguridad. Convergen aquí el DAST y el e2e: ambos deben pasar
  # para promover a producción. Contenido de la política: INTACTO.
  # Falla con blacklist (40018 SQLi, 40012 XSS reflejado, 40014 XSS almacenado,
  # 10202 CSRF), o HIGH > 0, o MEDIUM >= 5.
  # ==========================================================================
  security-gate:
    name: Security Gate · Reporte DAST (ZAP)
    needs: [dast, e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar reporte ZAP
        uses: actions/download-artifact@v4
        with:
          name: zap-baseline-report

      - name: Evaluar reporte DAST (ZAP) contra la política
        run: |
          python3 << 'EOF'
          import json
          import sys
          with open("report_json.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          high_count = 0
          medium_count = 0
          low_count = 0
          blacklist = {
              "40018",  # SQL Injection
              "40012",  # Reflected XSS
              "40014",  # Stored XSS
              "10202"   # CSRF
          }
          found_blacklist = set()
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  plugin_id = str(alert.get("pluginid", ""))
                  riskcode = int(alert.get("riskcode", 0))
                  if riskcode == 3:
                      high_count += 1
                  elif riskcode == 2:
                      medium_count += 1
                  elif riskcode == 1:
                      low_count += 1
                  if plugin_id in blacklist:
                      found_blacklist.add(plugin_id)
          print("=== RESUMEN SECURITY GATE ===")
          print(f"High encontrados: {high_count}")
          print(f"Medium encontrados: {medium_count}")
          print(f"Low encontrados: {low_count}")
          print(f"Blacklist encontrados: {len(found_blacklist)}")
          if found_blacklist:
              print("\nVulnerabilidades críticas detectadas:")
              for vuln in sorted(found_blacklist):
                  print(f" - {vuln}")
              sys.exit(1)
          if high_count > 0:
              print("\nSe detectaron vulnerabilidades HIGH")
              sys.exit(1)
          if medium_count >= 5:
              print("\nSe detectaron 5 o más vulnerabilidades MEDIUM")
              sys.exit(1)
          print("\nSecurity Gate aprobado")
          EOF

  deploy-prod:
    name: Deploy a Producción
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Prod (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}
          echo "Deploy a Producción disparado"

  # ==========================================================================
  # PRODUCTION HEALTH CHECK — validación FINAL del pipeline, en PARIDAD con el
  # Health Check de Dev (mismo script compartido, misma robustez, contra la URL
  # de PRODUCCIÓN miapp-6ex5). Que Render complete el deploy no garantiza que la
  # app arranque: este job confirma HTTP 200 + checks.database (GATE DURO) +
  # cabeceras de seguridad. Estrictamente read-only. Ver health-check.sh.
  # ==========================================================================
  production-health-check:
    name: Production Health Check
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Health Check reforzado (Producción)
        run: bash .github/scripts/health-check.sh https://miapp-6ex5.onrender.com "Producción"
###
