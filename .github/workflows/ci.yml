name: CI/CD Pipeline

# ============================================================================
# ARQUITECTURA (reestructuración — propuesta oficial NeuroAlert)
# ----------------------------------------------------------------------------
# Flujo objetivo (fail-fast + DevSecOps + pirámide de testing):
#
#   push/PR ─┬─► Code Quality & Build (type-check · lint · build)
#            └─► Static Security (SAST) & Supply Chain  [jobs en paralelo]
#                  · codeql            (SAST semántico, matriz)
#                  · eslint-security   (SAST de patrones, BLOQUEANTE)
#                  · bandit            (SAST Python, CUMPLIMIENTO — no bloquea)
#                  · supply-chain      (Trivy + SBOM, report-only)
#                  · dependency-scan   (npm audit gate, BLOQUEANTE)
#                        │
#                        ▼  (tests esperan calidad + TODA la seguridad estática)
#            ┌──► unit-tests ──┐
#            └──► integration-tests ──┴─► coverage-gate (85%) ─► deploy-dev*
#
#   *deploy-dev solo en push a main. A partir de aquí sigue la CADENA DE DEPLOY
#    (CD, Parte 2 — ya reestructurada):
#      deploy-dev → Health Check + Smoke → (🔒 e2e reservado) → dast →
#                   security-gate → deploy-prod → Production Health Check
#
# NOTA (modelo de ejecución de GitHub Actions): cada job corre en una VM nueva
# y aislada; NO existe un job "setup" reutilizable (su entorno no persiste entre
# jobs). Por eso cada job repite el bloque checkout + setup-node(cache npm) +
# npm ci: es el patrón idiomático y garantiza entornos reproducibles (Node 20).
# ============================================================================

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================================================
  # CODE QUALITY & BUILD — primera barrera técnica (fail-fast).
  # Fusiona el antiguo `quality` (type-check + lint) con el `build`, que antes
  # corría DESPUÉS de los tests. Se adelanta a esta etapa: no tiene sentido
  # testear/desplegar si el proyecto ni compila. El `nest build` es idéntico;
  # solo cambia de posición.
  # ==========================================================================
  code-quality-build:
    name: Code Quality & Build (type-check + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client (tipos para tsc/eslint/build)
        run: npx prisma generate
      - name: Type Check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Compilar (nest build)
        run: npm run build

  # ==========================================================================
  # STATIC SECURITY (SAST) & SUPPLY CHAIN — grupo de jobs en PARALELO.
  # Se implementa como jobs separados (no un único job) para respetar la
  # responsabilidad única y porque CodeQL usa matriz/permisos propios.
  # Como CONJUNTO, gatea las pruebas: nada se testea si la seguridad estática
  # bloqueante no pasa (shift-left security).
  # ==========================================================================

  # SAST semántico (matriz). Sube resultados a GitHub Security.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # SAST de patrones inseguros (eslint-plugin-security). BLOQUEANTE (--max-warnings 0).
  # Config SEPARADA (eslint.security.config.js) de la de calidad: distinta
  # responsabilidad. Coexiste con CodeQL (complementarios, no compiten).
  eslint-security:
    name: SAST - ESLint Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: ESLint Security (bloqueante)
        run: npm run lint:security

  # SAST de Python (Bandit). El backend es NestJS/TypeScript: NO hay código
  # Python propio, por lo que Bandit no encuentra nada que analizar. Se incluye
  # por requisito del curso como control de CUMPLIMIENTO, de forma transparente
  # y NO BLOQUEANTE (continue-on-error). El SAST efectivo de JS/TS lo cubren
  # eslint-security y CodeQL.
  bandit:
    name: SAST - Bandit (cumplimiento, no bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Bandit
        run: pip install bandit
      - name: Ejecutar Bandit sobre src/ (SAST Python)
        run: |
          {
            echo "## 🐍 Bandit (SAST Python) — control de cumplimiento"
            echo ""
            echo "El backend es NestJS/TypeScript: **no contiene código Python propio**."
            echo "Bandit se ejecuta por requisito del curso; el SAST efectivo de JS/TS"
            echo "lo cubren **ESLint Security** y **CodeQL**. No bloquea el pipeline."
            echo ""
            echo '```'
            bandit -r src -f screen 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Supply chain: Trivy (vulnerabilidades del árbol) + SBOM CycloneDX. Report-only.
  # ⏳ A FUTURO: evaluar volver Trivy bloqueante (hoy exit-code 0 por decisión
  # validada durante el desarrollo; convertirlo en gate es otra decisión).
  supply-chain:
    name: Supply Chain - Trivy + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Trivy - escaneo de vulnerabilidades (SARIF, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Subir resultados de Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy - generar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: cyclonedx
          output: sbom.cdx.json

      - name: Subir SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-backend
          path: sbom.cdx.json
          retention-days: 90

  # npm audit como GATE BLOQUEANTE en prod (OWASP A06). Falla ante HIGH/CRITICAL
  # en dependencias de producción salvo excepción documentada y vigente en
  # .github/audit-allowlist.json (ver docs/SECURITY-DEPENDENCIES.md).
  dependency-scan:
    name: Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Gate de dependencias de producción (bloqueante + allowlist)
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/audit-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # UNIT ∥ INTEGRATION — jobs SEPARADOS y en PARALELO (pirámide de testing).
  # Esperan a Code Quality & Build Y a TODA la etapa de seguridad estática
  # (no se testea si la seguridad bloqueante falló). Ninguno necesita Postgres:
  # la integración mockea Prisma (análogo a MSW en el frontend). La DB real
  # queda para el e2e (reservado, Parte 2).
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    needs: [code-quality-build, codeql, eslint-security, bandit, supply-chain, dependency-scan]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Ejecutar Unit Tests
        run: mkdir -p tests/reports && npx jest tests/unit --ci --json --outputFile=tests/reports/results-unit.json
      - name: Publicar resumen de Unit Tests
        if: always()
        run: node .github/scripts/test-summary.mjs tests/reports/results-unit.json "🧪 Unit Tests"

  integration-tests:
    name: Integration Tests
    needs: [code-quality-build, codeql, eslint-security, bandit, supply-chain, dependency-scan]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Ejecutar Integration Tests
        run: mkdir -p tests/reports && npx jest tests/integration --ci --forceExit --json --outputFile=tests/reports/results-integration.json
      - name: Publicar resumen de Integration Tests
        if: always()
        run: node .github/scripts/test-summary.mjs tests/reports/results-integration.json "🔗 Integration Tests"

  # ==========================================================================
  # COVERAGE GATE — corre la suite COMBINADA con cobertura y aplica el umbral
  # del 85% en las 4 métricas (coverageThreshold de Jest → falla el job). La
  # cobertura es propiedad del CÓDIGO, no de una suite: gatear sobre la
  # combinada evita forzar una pirámide invertida. Publica el reporte multivista.
  # ==========================================================================
  coverage-gate:
    name: Coverage Gate (85%)
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historia completa → patch coverage (código nuevo)
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Cobertura COMBINADA + gate 85% (falla si no se cumple)
        run: npm run test:coverage -- --ci
      - name: Cobertura por tipo (solo para el reporte, no gatea)
        if: always()
        run: |
          npx jest tests/unit --coverage --coverageDirectory=tests/reports/coverage-unit --coverageThreshold='{}' --ci || true
          npx jest tests/integration --coverage --coverageDirectory=tests/reports/coverage-integration --coverageThreshold='{}' --forceExit --ci || true
      - name: Reporte de cobertura (multivista)
        if: always()
        run: node .github/scripts/coverage-summary.mjs

  # ==========================================================================
  # DEPLOY DEV — depende exclusivamente del Coverage Gate (que ya arrastra,
  # transitivamente, calidad + build + seguridad estática + tests). Solo en
  # push a main. Contenido INTACTO (hook de Render + espera).
  # ==========================================================================
  deploy-dev:
    name: Deploy a Desarrollo
    needs: coverage-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a Dev (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_DEV_HOOK }}
          echo "Deploy a Dev disparado"
      - name: Esperar que Render inicie
        run: sleep 30

  # ==========================================================================
  # CADENA DE DESPLIEGUE (CD) — PARTE 2 (reestructurada según la propuesta):
  #   deploy-dev → Health Check + Smoke → (🔒 e2e reservado) → dast →
  #                security-gate → deploy-prod → Production Health Check
  # El E2E queda RESERVADO (if:false). Mientras no esté activo, `dast` sigue
  # colgando de `smoke`: si `dast` dependiera de un `e2e` saltado, GitHub Actions
  # saltaría toda la cadena. Al activar el e2e (subtarea): quitar `if:false` y
  # cambiar `dast` a `needs: e2e`. La lógica de ZAP, Security Gate y los deploy
  # hooks NO se tocan (contenido validado, reutilizado tal cual).
  # ==========================================================================
  # Health Check + Smoke Test: valida que la instancia DEV desplegada está
  # operativa Y es la versión nueva (comprueba el CONTENIDO del /health, no solo
  # HTTP 200). Contenido reutilizado verbatim; solo se clarifica el nombre.
  smoke-test:
    name: Health Check + Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que Dev responde Y es el backend NestJS
        run: |
          # Verifica el CONTENIDO, no solo HTTP 200: el NestJS responde
          # {"data":{...,"checks":{...}}}; la app anterior daba {"status":"healthy"}.
          # Así evitamos el falso positivo de que la versión vieja siga sirviendo
          # mientras un build nuevo falla. Damos margen al primer build de Docker.
          for i in $(seq 1 18); do
            BODY=$(curl -s --max-time 15 https://miapp-dev.onrender.com/health || true)
            if echo "$BODY" | grep -q '"checks"'; then
              echo "Dev OK (NestJS): $BODY"
              exit 0
            fi
            echo "Intento $i: aún no responde el NestJS (body: $(echo "$BODY" | head -c 80))…"
            sleep 20
          done
          echo "Dev no respondió como NestJS tras los reintentos (¿build falló o sigue en curso?)"
          exit 1

  # 🔒 E2E — RESERVADO (app real + postgres:15 + migraciones). Ver tests/e2e/README.md.
  # Para activarlo: quitar `if: false` y hacer que `dast` dependa de `e2e`
  # (needs: e2e). Aquí quedaría el servicio `postgres:15` + `prisma migrate deploy`
  # + `npm run test:e2e`.
  e2e:
    name: E2E (reservado)
    needs: smoke-test
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "E2E reservado — ver tests/e2e/README.md"

  dast:
    name: DAST - OWASP ZAP
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://miapp-dev.onrender.com'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

  security-gate:
    name: Security Gate
    needs: dast
    runs-on: ubuntu-latest

    steps:
      - name: Descargar reporte ZAP
        uses: actions/download-artifact@v4
        with:
          name: zap-baseline-report

      - name: Evaluar política de seguridad
        run: |
          python3 << 'EOF'
          import json
          import sys
          with open("report_json.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          high_count = 0
          medium_count = 0
          low_count = 0
          blacklist = {
              "40018",  # SQL Injection
              "40012",  # Reflected XSS
              "40014",  # Stored XSS
              "10202"   # CSRF
          }
          found_blacklist = set()
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  plugin_id = str(alert.get("pluginid", ""))
                  riskcode = int(alert.get("riskcode", 0))
                  if riskcode == 3:
                      high_count += 1
                  elif riskcode == 2:
                      medium_count += 1
                  elif riskcode == 1:
                      low_count += 1
                  if plugin_id in blacklist:
                      found_blacklist.add(plugin_id)
          print("=== RESUMEN SECURITY GATE ===")
          print(f"High encontrados: {high_count}")
          print(f"Medium encontrados: {medium_count}")
          print(f"Low encontrados: {low_count}")
          print(f"Blacklist encontrados: {len(found_blacklist)}")
          if found_blacklist:
              print("\nVulnerabilidades críticas detectadas:")
              for vuln in sorted(found_blacklist):
                  print(f" - {vuln}")
              sys.exit(1)
          if high_count > 0:
              print("\nSe detectaron vulnerabilidades HIGH")
              sys.exit(1)
          if medium_count >= 5:
              print("\nSe detectaron 5 o más vulnerabilidades MEDIUM")
              sys.exit(1)
          print("\nSecurity Gate aprobado")
          EOF

  deploy-prod:
    name: Deploy a Producción
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Prod (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}
          echo "Deploy a Producción disparado"

  # ==========================================================================
  # PRODUCTION HEALTH CHECK — validación FINAL del pipeline. Que Render complete
  # el deploy no garantiza que la app arranque; este job confirma que la versión
  # en PROD quedó realmente operativa. Reutiliza el patrón del smoke de Dev
  # (valida el CONTENIDO del /health), contra la URL de PRODUCCIÓN.
  # ==========================================================================
  production-health-check:
    name: Production Health Check
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que Prod responde Y es el backend NestJS
        run: |
          # Igual criterio que el smoke de Dev: valida el CONTENIDO (no solo
          # HTTP 200) del /health de PRODUCCIÓN (miapp-6ex5, NO miapp). Se da
          # margen al build/arranque de Render.
          for i in $(seq 1 18); do
            BODY=$(curl -s --max-time 15 https://miapp-6ex5.onrender.com/health || true)
            if echo "$BODY" | grep -q '"checks"'; then
              echo "Prod OK (NestJS): $BODY"
              exit 0
            fi
            echo "Intento $i: aún no responde el NestJS en prod (body: $(echo "$BODY" | head -c 80))…"
            sleep 20
          done
          echo "Prod no respondió como NestJS tras los reintentos (¿deploy falló o sigue en curso?)"
          exit 1
###
