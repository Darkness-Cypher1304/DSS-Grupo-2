name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Tests + Análisis de Seguridad
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      # NestJS exige estos secrets para firmar JWT al inicializar (valores de prueba)
      JWT_ACCESS_SECRET: test_access_secret_minimo_32_chars_aaaaaaaaaaaa
      JWT_REFRESH_SECRET: test_refresh_secret_minimo_32_chars_bbbbbbbbbbbb
      NODE_ENV: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client + aplicar migraciones
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Ejecutar tests (Jest) + cobertura
        run: npm run test:cov -- --ci --passWithNoTests
      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Análisis de seguridad de dependencias (npm audit)
        run: npm audit --audit-level=high || true
  # CodeQL corre EN PARALELO al job test (sin needs): analisis estatico de
  # seguridad (SAST) sobre el codigo TypeScript y los workflows. Reporta al tab
  # Security del repo y NO bloquea el deploy (deploy-dev solo needs: test, codeql).
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # Trivy + SBOM corren EN PARALELO (sin needs) igual que codeql: escaneo de
  # vulnerabilidades de dependencias (report-only, exit-code 0) + inventario
  # CycloneDX. NO alimenta deploy-dev/security-gate -> no puede sumar Medium
  # al gate de ZAP ni bloquear el pipeline.
  supply-chain:
    name: Supply Chain - Trivy + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Trivy - escaneo de vulnerabilidades (SARIF, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Subir resultados de Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy - generar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: cyclonedx
          output: sbom.cdx.json

      - name: Subir SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-backend
          path: sbom.cdx.json
          retention-days: 90

  deploy-dev:
    name: Deploy a Desarrollo
    needs: [test, codeql]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a Dev (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_DEV_HOOK }}
          echo "Deploy a Dev disparado"
      - name: Esperar que Render inicie
        run: sleep 30

  smoke-test:
    name: Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que Dev responde Y es el backend NestJS
        run: |
          # Verifica el CONTENIDO, no solo HTTP 200: el NestJS responde
          # {"data":{...,"checks":{...}}}; la app anterior daba {"status":"healthy"}.
          # Así evitamos el falso positivo de que la versión vieja siga sirviendo
          # mientras un build nuevo falla. Damos margen al primer build de Docker.
          for i in $(seq 1 18); do
            BODY=$(curl -s --max-time 15 https://miapp-dev.onrender.com/health || true)
            if echo "$BODY" | grep -q '"checks"'; then
              echo "Dev OK (NestJS): $BODY"
              exit 0
            fi
            echo "Intento $i: aún no responde el NestJS (body: $(echo "$BODY" | head -c 80))…"
            sleep 20
          done
          echo "Dev no respondió como NestJS tras los reintentos (¿build falló o sigue en curso?)"
          exit 1
  dast:
    name: DAST - OWASP ZAP
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://miapp-dev.onrender.com'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

  security-gate:
    name: Security Gate
    needs: dast
    runs-on: ubuntu-latest

    steps:
      - name: Descargar reporte ZAP
        uses: actions/download-artifact@v4
        with:
          name: zap-baseline-report

      - name: Evaluar política de seguridad
        run: |
          python3 << 'EOF'
          import json
          import sys
          with open("report_json.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          high_count = 0
          medium_count = 0
          low_count = 0
          blacklist = {
              "40018",  # SQL Injection
              "40012",  # Reflected XSS
              "40014",  # Stored XSS
              "10202"   # CSRF
          }
          found_blacklist = set()
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  plugin_id = str(alert.get("pluginid", ""))
                  riskcode = int(alert.get("riskcode", 0))
                  if riskcode == 3:
                      high_count += 1
                  elif riskcode == 2:
                      medium_count += 1
                  elif riskcode == 1:
                      low_count += 1
                  if plugin_id in blacklist:
                      found_blacklist.add(plugin_id)
          print("=== RESUMEN SECURITY GATE ===")
          print(f"High encontrados: {high_count}")
          print(f"Medium encontrados: {medium_count}")
          print(f"Low encontrados: {low_count}")
          print(f"Blacklist encontrados: {len(found_blacklist)}")
          if found_blacklist:
              print("\nVulnerabilidades críticas detectadas:")
              for vuln in sorted(found_blacklist):
                  print(f" - {vuln}")
              sys.exit(1)
          if high_count > 0:
              print("\nSe detectaron vulnerabilidades HIGH")
              sys.exit(1)
          if medium_count >= 5:
              print("\nSe detectaron 5 o más vulnerabilidades MEDIUM")
              sys.exit(1)
          print("\nSecurity Gate aprobado")
          EOF

  deploy-prod:
    name: Deploy a Producción
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Prod (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}
          echo "Deploy a Producción disparado"
