# ============================================================
# NeuroAlert · Frontend · CI/CD Pipeline
# Siguiendo la guía del curso: Tests → Deploy Dev → Smoke → Deploy Prod
# ============================================================
# SECRETS necesarios en GitHub (Settings → Secrets → Actions):
#   RENDER_FRONTEND_DEV_HOOK   → Deploy hook del frontend DEV en Render
#   RENDER_FRONTEND_PROD_HOOK  → Deploy hook del frontend PROD en Render
# ============================================================

name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cicd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

env:
  NODE_VERSION: '20'

jobs:

  # ============================================================
  # JOB 1: Tests + Build + Análisis de seguridad
  # ============================================================
  test:
    name: Tests + Análisis de Seguridad
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build de producción
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://neuroalert-backend-prod.onrender.com' }}
        run: npm run build

      - name: Análisis de seguridad (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================================
  # JOB 1.5: Detectar si los deploy-hooks están configurados
  # (los secrets no se pueden usar en `if:` de job; se exponen como output)
  # ============================================================
  config:
    name: Verificar configuración de deploy
    needs: test
    runs-on: ubuntu-latest
    outputs:
      has_dev_hook: ${{ steps.c.outputs.has_dev_hook }}
      has_prod_hook: ${{ steps.c.outputs.has_prod_hook }}
    steps:
      - name: Evaluar secrets de deploy
        id: c
        env:
          DEV_HOOK: ${{ secrets.RENDER_FRONTEND_DEV_HOOK }}
          PROD_HOOK: ${{ secrets.RENDER_FRONTEND_PROD_HOOK }}
        run: |
          if [ -n "$DEV_HOOK" ]; then echo "has_dev_hook=true" >> "$GITHUB_OUTPUT"; else echo "has_dev_hook=false" >> "$GITHUB_OUTPUT"; echo "⏭️  RENDER_FRONTEND_DEV_HOOK no configurado — se omitirá el deploy a Dev."; fi
          if [ -n "$PROD_HOOK" ]; then echo "has_prod_hook=true" >> "$GITHUB_OUTPUT"; else echo "has_prod_hook=false" >> "$GITHUB_OUTPUT"; echo "⏭️  RENDER_FRONTEND_PROD_HOOK no configurado — se omitirá el deploy a Prod."; fi

  # ============================================================
  # JOB 2: Deploy a Desarrollo
  # Solo corre si el deploy-hook está configurado (si no, se SALTA → no rompe CI).
  # Al saltarse, smoke-test y deploy-prod (que dependen de él) también se saltan.
  # ============================================================
  deploy-dev:
    name: Deploy a Desarrollo
    needs: config
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      needs.config.outputs.has_dev_hook == 'true'

    environment:
      name: development
      url: https://neuroalert-frontend-dev.onrender.com

    steps:
      - name: Deploy a Dev (Render)
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEV_HOOK }}
        run: |
          curl -fsS -X POST "$HOOK"
          echo "Deploy a Dev disparado"

      - name: Esperar que Render inicie
        run: sleep 30

  # ============================================================
  # JOB 3: Smoke Test en Dev
  # ============================================================
  smoke-test:
    name: Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Verificar que Dev responde
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://neuroalert-frontend-dev.onrender.com)
            if [[ $STATUS -eq 200 ]]; then
              echo "Dev responde correctamente (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i fallido (HTTP $STATUS), reintentando..."
            sleep 15
          done
          echo "Dev no responde despues de 5 intentos"
          exit 1

  # ============================================================
  # JOB 4: Deploy a Producción
  # ============================================================
  deploy-prod:
    name: Deploy a Producción
    needs: [config, smoke-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.config.outputs.has_prod_hook == 'true'

    environment:
      name: production
      url: https://neuroalert-frontend-prod.onrender.com

    steps:
      - name: Deploy a Prod (Render)
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_PROD_HOOK }}
        run: |
          curl -fsS -X POST "$HOOK"
          echo "Deploy a Producción disparado"

      - name: Resumen
        run: |
          echo "============================================"
          echo "NeuroAlert Frontend - Deploy completado"
          echo "DEV:  https://neuroalert-frontend-dev.onrender.com"
          echo "PROD: https://neuroalert-frontend-prod.onrender.com"
          echo "============================================"
